name: Comprobar y desplegar

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: despliegue
  cancel-in-progress: false

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Instalar Chromium para las pruebas en navegador
        run: npx playwright install --with-deps chromium
      - name: Comprobar caracteres invisibles
        run: npm run comprobar:caracteres
      - name: Comprobar que los esquemas están sincronizados
        run: npm run comprobar:esquemas
      - name: Validar el contenido
        run: npm run comprobar:contenido
      - name: Pasar las pruebas unitarias
        run: npm test
      - name: Compilar la web
        run: npm run build
      - name: Compilar las fixtures
        run: npm run build:fixtures
      - name: Validar el HTML generado
        run: npm run validar
      - name: Comprobar los enlaces
        run: npm run comprobar:enlaces
      - name: Comprobar la web en el navegador
        run: npm run comprobar:web
      - name: Comprobar el rendimiento
        run: npm run comprobar:rendimiento
      - name: Guardar los informes de Lighthouse
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: informes-lighthouse
          path: .lighthouseci/
          if-no-files-found: warn

  desplegar:
    needs: comprobar
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: produccion
    steps:
      - name: Avisar a Easypanel
        env:
          EASYPANEL_DEPLOY_URL: ${{ secrets.EASYPANEL_DEPLOY_URL }}
        run: curl --fail --silent --show-error --max-time 30 "$EASYPANEL_DEPLOY_URL" > /dev/null
